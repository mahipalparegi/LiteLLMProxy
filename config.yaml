# LiteLLM Proxy v1.99.0 - Azure OpenAI models in Microsoft Foundry.
# Route: https://docs.litellm.ai/docs/providers/azure/
# Access groups: https://docs.litellm.ai/docs/proxy/model_access_groups
#
# access_groups is the customer boundary. Keys hold ["customer-models"], so a
# model outside that group is configured but unreachable by any customer key.
#
# api_version is deliberately absent: LiteLLM v1.99.0 defaults to
# 2025-02-01-preview. Set the documented AZURE_API_VERSION env var to override.
#
# RENAME THESE to match your Foundry deployment names exactly. Check yours with:
#   az cognitiveservices account deployment list -n <resource> -g <rg> -o table
# Then run scripts/verify_models_and_costs.py before issuing any customer key.

model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: azure/gpt-5.5
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-sol
    litellm_params:
      model: azure/gpt-5.6-sol
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-terra
    litellm_params:
      model: azure/gpt-5.6-terra
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-luna
    litellm_params:
      model: azure/gpt-5.6-luna
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  # QUARANTINED ON v1.99.0, deliberately not in customer-models.
  # LiteLLM's GPT-5 reasoning classifier matches gpt-5* only, so on this version
  # a gpt-6-astra request keeps max_tokens and temperature as sent and the
  # provider rejects them. The widened classifier ships after v1.99.0. Callers
  # must send max_completion_tokens and omit temperature until then. Promote it
  # to customer-models only after bumping LITELLM_VERSION and re-running
  # scripts/verify_models_and_costs.py.
  - model_name: gpt-6-astra
    litellm_params:
      model: azure/gpt-6-astra
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["admin-preview"]

  # PRICING (README J). No price is invented here. Override only from the
  # official Microsoft pricing page, and never with 0 - LiteLLM skips budget
  # checks entirely for zero-cost models.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Verify spend against the database before admitting a budgeted request;
  # reject (503) if it cannot be verified. Reservation stays on so concurrent
  # requests cannot share the last dollar.
  fail_closed_budget_enforcement: true
  disable_budget_reservation: false

  # Both default off. Pinned so a client header can never reach Azure as a
  # provider credential.
  forward_client_headers_to_llm_api: false
  forward_llm_provider_auth_headers: false

  store_prompts_in_spend_logs: false
  allow_public_health_readiness_details: false
  # Per worker; total is pool x workers x instances. See README L.
  database_connection_pool_limit: 20

litellm_settings:
  turn_off_message_logging: true
  request_timeout: 600

  # Required above one worker: this block is what makes the proxy read
  # REDIS_URL. Covers rate limits, budgets, cache invalidation and the pod lock.
  cache: true
  cache_params:
    type: redis
    namespace: litellm
  enable_redis_auth_cache: true

# router_settings is intentionally absent: no fallbacks, so a request refused
# for budget, RPM or TPM fails with that error instead of being rerouted.
