# LiteLLM Proxy v1.99.0 - Azure OpenAI models in Microsoft Foundry. See README.
#
# access_groups is the customer boundary: a model outside customer-models is
# configured but unreachable by any customer key.
# No api_version: v1.99.0 defaults to 2025-02-01-preview, AZURE_API_VERSION overrides.
# Model names must match your Foundry deployment names exactly.

model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: azure/gpt-5.5
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-sol
    litellm_params:
      model: azure/gpt-5.6-sol
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-terra
    litellm_params:
      model: azure/gpt-5.6-terra
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  - model_name: gpt-5.6-luna
    litellm_params:
      model: azure/gpt-5.6-luna
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  # gpt5_series/ selects LiteLLM's GPT-5 request path (renames max_tokens to
  # max_completion_tokens); the gate is `"gpt-5" in model`, which gpt-6 fails.
  # Stripped before the deployment path is built, so this still calls gpt-6-astra.
  # Removing it makes every max_tokens request 400.
  - model_name: gpt-6-astra
    litellm_params:
      model: azure/gpt5_series/gpt-6-astra
      api_base: os.environ/AZURE_OPENAI_API_BASE
      tenant_id: os.environ/AZURE_TENANT_ID
      client_id: os.environ/AZURE_CLIENT_ID
      client_secret: os.environ/AZURE_CLIENT_SECRET
      azure_scope: os.environ/AZURE_SCOPE
    model_info:
      mode: chat
      access_groups: ["customer-models"]

  # No prices are set here. Override only from official Microsoft pricing, and
  # never with 0 - LiteLLM skips budget checks entirely for zero-cost models.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Verify spend against the database before admitting a budgeted request, and
  # reject it if that is not possible.
  fail_closed_budget_enforcement: true
  disable_budget_reservation: false

  # Pinned off so a client header can never reach Azure as a provider credential.
  forward_client_headers_to_llm_api: false
  forward_llm_provider_auth_headers: false

  store_prompts_in_spend_logs: false
  allow_public_health_readiness_details: false
  # Per worker; total is pool x workers x instances.
  database_connection_pool_limit: 20

litellm_settings:
  turn_off_message_logging: true
  request_timeout: 600

  # Required above one worker: this is what makes the proxy read REDIS_URL.
  cache: true
  cache_params:
    type: redis
    namespace: litellm
  enable_redis_auth_cache: true

# router_settings is intentionally absent: no fallbacks, so a refused request
# fails with its own error instead of being rerouted.
