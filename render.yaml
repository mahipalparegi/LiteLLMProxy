# Render Blueprint. Validate with: render blueprints validate render.yaml
services:
  - type: web
    name: litellm-azure-proxy
    runtime: docker
    # 4 workers x (1 vCPU + 4 GB), LiteLLM's documented per-worker floor.
    plan: 4c-16g
    region: virginia
    # One instance so the startup schema migration has a single owner.
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/readiness
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PORT
        value: "4000"
      - key: STORE_MODEL_IN_DB
        value: "True"
      - key: LITELLM_LOG
        value: INFO
      # Disables load_dotenv so a stray .env cannot inject credentials.
      - key: LITELLM_MODE
        value: PRODUCTION
      - key: LITELLM_NUM_WORKERS
        value: "4"
      # DISABLE_SCHEMA_UPDATE is deliberately unset: proxy startup migrates.
      - key: AZURE_SCOPE
        value: https://cognitiveservices.azure.com/.default

      - key: DATABASE_URL
        fromDatabase:
          name: litellm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: litellm-cache
          type: keyvalue
          property: connectionString

      # Render prompts for sync:false values on initial Blueprint creation only.
      - key: LITELLM_MASTER_KEY
        sync: false
      - key: LITELLM_SALT_KEY
        sync: false
      - key: AZURE_OPENAI_API_BASE
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: litellm-cache
    plan: 1g
    region: virginia
    # Empty list blocks every external connection: private network only.
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: litellm-postgres
    databaseName: litellm
    user: litellm
    region: virginia
    # LiteLLM's sizing row for up to 1K sustained RPS; 400 connection ceiling.
    plan: 4c-16g
    postgresMajorVersion: "16"
